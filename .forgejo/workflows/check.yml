name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - components/continuity
          - components/action-control
          - components/reporting
          - components/orchestration
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.component }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.component }}/go.mod
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
