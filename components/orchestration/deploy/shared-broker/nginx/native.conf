# Install as a server configuration inside nginx's http context.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/llewm/tls/fullchain.pem;
    ssl_certificate_key /etc/llewm/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location ~ ^/v1/broker(?:/commands|/pull)?$ {
        include /etc/nginx/llewm-proxy-options.conf;
        proxy_pass http://127.0.0.1:9469;
    }
    location / { return 404; }
}
