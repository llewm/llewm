worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/llewm/tls/fullchain.pem;
        ssl_certificate_key /etc/llewm/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location ~ ^/v1/broker(?:/commands|/pull)?$ {
            include /etc/nginx/llewm-proxy-options.conf;
            proxy_pass http://127.0.0.1:9469;
        }
        location / { return 404; }
    }
}
